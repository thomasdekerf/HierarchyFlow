# Configuration for virtual staining (HE -> IHC)
output: ./output_dir/
task_name: virtual_stain_paired_losschange

dataset:
  train:
    source_dir: '/home/thomas/Desktop/DATA/MIST/HER2/HER2/TrainValAB/trainA'
    target_dir: '/home/thomas/Desktop/DATA/MIST/HER2/HER2/TrainValAB/trainB'
    width: 256
    height: 256
    scale_l: 1.0
    scale_h: 1.0
    transform: []
    random_pair: False
    return_name: True
    batch_size: 10
  test:
    source_dir: '/home/thomas/Desktop/DATA/MIST/HER2/HER2/TrainValAB/valA'
    target_dir: '/home/thomas/Desktop/DATA/MIST/HER2/HER2/TrainValAB/valB'
    width: 256
    height: 256
    scale_l: 1.0
    scale_h: 1.0
    transform: []
    random_pair: False
    return_name: True
    batch_size: 1

lr: 0.0001
max_iter: 300000
print_freq: 500
save_freq: 500
eval_freq: 5000
resume: False
load_path: ''

network:
  configurable: False
  pad_size: 10
  in_channel: 3
  out_channels: [30, 120]
  weight_type: 'learned'

loss:
  vgg_encoder: 'model/losses/vgg_model/vgg_normalised.pth'
  k: -1.0
  weight: 0.8

lr_scheduler:
  type: cosine
  eta_min: 0.0

early_stopping:
  enabled: true
  metric: ssim  # options: ssim, psnr, lpips
  mode: max
  patience: 10
  min_delta: 0.0
  lpips_net: alex
